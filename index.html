<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/icon-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="People Growth Africa helps growing businesses across Nigeria and Africa build the HR systems and cultures that make growth sustainable." />
    <meta name="theme-color" content="#0F6E56" />
    <link rel="canonical" href="https://www.peoplegrowthafrica.com/" />
    <meta property="og:title" content="People Growth Africa | HR & Organisational Consulting" />
    <meta property="og:description" content="People Growth Africa helps growing businesses across Nigeria and Africa build the people systems and cultures that make sustainable growth possible." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="People Growth Africa" />
    <meta property="og:url" content="https://www.peoplegrowthafrica.com/" />
    <meta property="og:image" content="https://www.peoplegrowthafrica.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="People Growth Africa logo on the brand green background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="People Growth Africa | HR & Organisational Consulting" />
    <meta name="twitter:description" content="People Growth Africa helps growing businesses across Nigeria and Africa build the people systems and cultures that make sustainable growth possible." />
    <meta name="twitter:image" content="https://www.peoplegrowthafrica.com/images/og-image.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <title>People Growth Africa | HR & Organisational Consulting</title>

    <!-- Organization identity: the single canonical entity for the whole site.
         Emitted statically (not injected by JS) so crawlers that do not execute
         JavaScript still see it, and so per-page scripts can reference it by
         @id instead of declaring a competing Organization node. -->
    <script type="application/ld+json" id="org-schema">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.peoplegrowthafrica.com/#organization",
        "name": "People Growth Africa",
        "url": "https://www.peoplegrowthafrica.com/",
        "logo": "https://www.peoplegrowthafrica.com/images/logo-black.png",
        "description": "Practical HR and people systems for growing businesses across Nigeria and Africa.",
        "areaServed": "Africa",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "sameAs": [
          "https://www.linkedin.com/company/people-growth-africa/",
          "https://www.instagram.com/peoplegrowthafrica",
          "https://tiktok.com/@peoplegrowthafrica",
          "https://www.youtube.com/@peoplegrowthafrica"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Version the SW cache with the deployed bundle filename, so every
          // deploy gets a fresh cache (in dev there is no bundle -> 'pga-dev').
          const bundle = document.querySelector('script[type="module"][src*="/assets/"]');
          const version = bundle ? new URL(bundle.src, location.href).pathname.split('/').pop() : '';
          const swUrl = version ? '/sw.js?v=' + encodeURIComponent(version) : '/sw.js';
          navigator.serviceWorker.register(swUrl).then((reg) => {
            console.log('PWA ServiceWorker registered with scope: ', reg.scope);
          }).catch((err) => {
            console.log('PWA ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
