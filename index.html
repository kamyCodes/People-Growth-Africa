  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Version the SW cache with the deployed bundle filename, so every
          // deploy gets a fresh cache (in dev there is no bundle -> 'pga-dev').
          const bundle = document.querySelector('script[type="module"][src*="/assets/"]');
          const version = bundle ? new URL(bundle.src, location.href).pathname.split('/').pop() : '';
          const swUrl = version ? '/sw.js?v=' + encodeURIComponent(version) : '/sw.js';
          navigator.serviceWorker.register(swUrl).then((reg) => {
            console.log('PWA ServiceWorker registered with scope: ', reg.scope);
          }).catch((err) => {
            console.log('PWA ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
